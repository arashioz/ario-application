# آریو — استک کامل سرور
# MongoDB 4.4 (بدون AVX) + Backend + Nginx (HTTPS روی IP)
#
# روی سرور:
#   cp .env.prod.example .env.prod
#   # DOMAIN را با IP سرور پر کن
#   docker compose --env-file .env.prod up -d --build
#   docker compose --env-file .env.prod exec backend node dist/seed.js
#
# یا: ./deploy/up.sh

services:
  mongodb:
    # 4.4: روی CPU بدون AVX کار می‌کند (mongo 5+ معمولاً کرش می‌کند)
    image: mongo:4.4
    container_name: ario-mongodb
    restart: unless-stopped
    # روی سرور پورت را به بیرون باز نکن — فقط شبکه داخلی
    # برای دیباگ لوکال می‌توانی uncomment کنی: "27017:27017"
    volumes:
      - ario_mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: ario-shop
    healthcheck:
      test: ['CMD', 'mongo', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - ario

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ario-backend
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      PORT: 3001
      MONGODB_URI: mongodb://mongodb:27017/ario-shop
      WS_PATH: /ws
      NODE_ENV: production
    volumes:
      - ario_uploads:/app/uploads
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3001/health']
      interval: 20s
      timeout: 5s
      retries: 8
      start_period: 25s
    expose:
      - '3001'
    networks:
      - ario

  nginx:
    build:
      context: .
      dockerfile: deploy/Dockerfile.nginx
    container_name: ario-nginx
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      SSL_MODE: ${SSL_MODE:-selfsigned}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ario_certbot_www:/var/www/certbot
      - ario_letsencrypt:/etc/letsencrypt
      - ario_nginx_ssl:/etc/nginx/ssl
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - ario

  # پنل دیتابیس — اختیاری: docker compose --profile tools up -d
  mongo-express:
    image: mongo-express:1.0.2-20
    container_name: ario-mongo-express
    profiles: ['tools']
    ports:
      - '8081:8081'
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongodb:27017/
      ME_CONFIG_BASICAUTH: 'false'
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ario

  certbot:
    image: certbot/certbot:latest
    container_name: ario-certbot
    profiles: ['ssl']
    volumes:
      - ario_certbot_www:/var/www/certbot
      - ario_letsencrypt:/etc/letsencrypt
    networks:
      - ario
    entrypoint: certbot

volumes:
  ario_mongo_data:
  ario_uploads:
  ario_certbot_www:
  ario_letsencrypt:
  ario_nginx_ssl:

networks:
  ario:
    driver: bridge
